services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: nflpi
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nflpi}
      POSTGRES_DB: nflpi
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nflpi"]
      interval: 5s
      retries: 10
    restart: unless-stopped

  app:
    build: .
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 30s
      retries: 3
    restart: unless-stopped

  worker:
    build: .
    env_file: .env
    command: ["python", "-m", "nflpi.jobs", "loop"]
    depends_on:
      db:
        condition: service_healthy
      app:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
