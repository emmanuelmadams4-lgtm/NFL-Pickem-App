services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: nflpi
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: nflpi
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nflpi"]
      interval: 5s
      retries: 10
    restart: unless-stopped

  app:
    build: .
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "0.0.0.0:${APP_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import json, sys, urllib.request; sys.exit(0 if json.load(urllib.request.urlopen('http://localhost:8000/api/health', timeout=5)).get('database') is True else 1)"]
      interval: 30s
      start_period: 60s
      retries: 3
    restart: unless-stopped

  worker:
    build: .
    env_file: .env
    command: ["python", "-m", "nflpi.jobs", "loop"]
    depends_on:
      db:
        condition: service_healthy
      app:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
