[project]
name = "nflpi"
version = "0.1.0"
description = "NFL Pick'em Intelligence backend"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.143",
  "uvicorn[standard]>=0.54",
  "sqlalchemy>=2.1",
  "alembic>=1.20",
  "pydantic>=2.14",
  "pydantic-settings>=2.15",
  "psycopg[binary]>=3.3",
  "pandas>=3.0",
  "numpy>=2.5",
  "scikit-learn>=1.9",
  "httpx>=0.28",
  "anthropic>=1.13",
  "pywebpush>=2.5",
  "requests>=2.34.2",
  "feedparser>=6.0.14",
  "claude-agent-sdk>=0.2.165",
]

[dependency-groups]
dev = [
    "pytest>=9.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["nflpi"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
